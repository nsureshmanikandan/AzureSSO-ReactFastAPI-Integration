name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: rg-itp-demo-dev
  CONTAINER_APP_NAME: ca-itp-backend-dev

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps and run tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Docker login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/itp-backend:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/itp-backend:latest backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/itp-backend:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/itp-backend:latest

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/itp-backend:${{ github.sha }}

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_AZURE_CLIENT_ID: a4b518c1-417c-4b25-9484-6ffa4a79abc3
          VITE_AZURE_TENANT_ID: b19c9a9b-09d8-45e5-b378-571b6b8a9cc9
          VITE_REDIRECT_URI: https://proud-ground-00667a40f.7.azurestaticapps.net/
          VITE_API_SCOPE: api://a4b518c1-417c-4b25-9484-6ffa4a79abc3/access_as_user
          VITE_API_BASE_URL: https://apim-itp-demo-dev.azure-api.net

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
